<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../public/css/style.css?v=4">
    <script src="../public/js/botanical.js" defer></script>
    <script src="../public/js/login.js" defer></script>
</head>
<body>  
    <div class="login_form">
        <div class="login-brand">
            <span class="login-brand-mark">✦</span>
            <span class="login-brand-name">Extremity Vault</span>
        </div>
        <h2>Sign In</h2>
        <form id="login_page">
            <div id = "login_elements">
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                <input type="submit" id="submit_button" name="Submit">
                <div id="message"></div>

            </div>
        </form>

        <p>Don't have an account? <a href="register.html">Register here</a></p>
    </div>
</body>
</html>
