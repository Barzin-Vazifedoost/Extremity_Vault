<!DOCTYPE html>
<!--
  Erin Sobers
  March 2026
  Registration page for Extremity Vault.
  Presents the account creation form with name, email, and password fields.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="../public/css/style.css?v=4">
    <script src="../public/js/botanical.js" defer></script>
    <script src="../public/js/register.js" defer></script>
</head>
<body>
    <div class="login_form">
        <div class="login-brand">
            <span class="login-brand-mark">✦</span>
            <span class="login-brand-name">Extremity Vault</span>
        </div>
        <h2>Create Account</h2>
        <form id="register_page">
            <div id="login_elements">
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                <input type="submit" id="submit_button" name="Submit">
                <div id="message"></div>
            </div>

            <p>Already have an account? <a href="login.html">Login here</a></p>
        </form>
    </div>
</body>
</html>
