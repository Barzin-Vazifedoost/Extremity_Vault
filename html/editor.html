<!DOCTYPE html>
<!--
  Erin Sobers
  March 2026
  Admin editor page for Extremity Vault.
  Contains the article creation form and the manage/publish/delete article list.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor - Extremity Vault</title>
    <link rel="stylesheet" href="../public/css/style.css?v=2">
    <script src="../public/js/botanical.js" defer></script>
    <script src="../public/js/editor.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <span class="nav-brand">Extremity Vault</span>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="#" id="logout-btn">Logout</a>
        </div>
    </nav>

    <div class="container">
        <h1>Editor</h1>

        <h2>Create Article</h2>
        <form id="article_form" class="editor-form">
            <div class="editor-fields">
                <input type="text" id="title" name="title" placeholder="Article Title" required>
                <select id="category_id" name="category_id" required>
                    <option value="">Select Category</option>
                    <option value="1">Characters</option>
                    <option value="2">Settings</option>
                    <option value="3">Items</option>
                </select>
                <textarea id="content" name="content" placeholder="Write your article here..." required></textarea>
                <label class="upload-label">
                    <span>Cover Image (optional)</span>
                    <input type="file" id="image_file" name="image_file" accept="image/jpeg,image/png,image/gif,image/webp">
                </label>
                <img id="image_preview" class="article-image" src="" alt="" style="display:none;">
                <input type="submit" value="Save as Draft">
                <div id="message"></div>
            </div>
        </form>

        <h2 style="margin-top:40px;">Manage Articles</h2>
        <div id="articles-list"></div>
    </div>
</body>
</html>
