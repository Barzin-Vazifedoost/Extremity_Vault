<!DOCTYPE html>

  Bookmarks page for Extremity Vault. Shows the authenticated user's saved articles with category filter dropdown.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookmarks - Extremity Vault</title>
    <link rel="stylesheet" href="../public/css/style.css?v=2">
    <script src="../public/js/botanical.js" defer></script>
    <script src="../public/js/bookmarks.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <span class="nav-brand">Extremity Vault</span>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="articles.html">Articles</a>
            <a href="#" id="logout-btn">Logout</a>
        </div>
    </nav>
    <div class="container">
        <h1>My Bookmarks</h1>
        <div class="bookmark-filter">
            <select id="category-filter">
                <option value="">All Categories</option>
                <option value="1">Characters</option>
                <option value="2">Settings</option>
                <option value="3">Items</option>
            </select>
        </div>
        <div id="bookmarks-container"></div>
        <div id="message"></div>
    </div>
    <button class="back-to-top" id="back-to-top" aria-label="Back to top">&#8679;</button>
</body>
</html>
